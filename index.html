<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4A5E36">
<link rel="icon" href="icon-192.png">
<title>军队文职备考工作台</title>
<style>
:root{
  --bg:#F2F4EF; --surface:#FFFFFF; --ink:#1D271F; --muted:#66705F; --line:#D6DBCF;
  --olive:#4A5E36; --olive-soft:#E3E9DA; --red:#BF3A2C; --red-soft:#F7E3DF; --amber:#9A6B12;
  --shadow:0 1px 0 rgba(29,39,31,.06);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131712; --surface:#1B2019; --ink:#E5E9E0; --muted:#9AA391; --line:#2F372C;
    --olive:#A3B886; --olive-soft:#26301F; --red:#E66A5B; --red-soft:#3A201C; --amber:#D9A748;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131712; --surface:#1B2019; --ink:#E5E9E0; --muted:#9AA391; --line:#2F372C;
  --olive:#A3B886; --olive-soft:#26301F; --red:#E66A5B; --red-soft:#3A201C; --amber:#D9A748;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{font-family:"Noto Serif SC","Songti SC","STSong",serif;font-weight:800;line-height:1.3;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--olive);outline-offset:2px}
img{max-width:100%}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-inner{max-width:880px;margin:0 auto;padding:14px 18px 0}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:4px 12px;flex-wrap:wrap}
.count{white-space:nowrap}
.brand h1{font-size:20px}
.count{font-size:14px;color:var(--muted);white-space:nowrap}
.count b{font-family:"Noto Serif SC",serif;font-size:22px;color:var(--red);font-weight:800;margin:0 2px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:none;padding:8px 12px;border-radius:8px 8px 0 0;color:var(--muted);text-decoration:none;font-size:15px;border-bottom:3px solid transparent}
nav.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--olive);font-weight:600}

main{max-width:880px;margin:0 auto;padding:20px 18px 80px}
.banner{background:var(--red-soft);color:var(--ink);border-left:4px solid var(--red);padding:10px 14px;border-radius:6px;margin-bottom:16px;font-size:14px}
.hint{color:var(--muted);font-size:14px}
.section{margin-bottom:28px}
.section > h2{font-size:18px;margin-bottom:10px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;box-shadow:var(--shadow)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;font-size:15px}
.btn.primary{background:var(--olive);border-color:var(--olive);color:var(--bg);font-weight:600}
.btn.red{color:var(--red);border-color:var(--red)}
.btn.small{padding:4px 10px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
select,input[type=text],input[type=date],textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:15px;max-width:100%}
textarea{width:100%;min-height:70px;resize:vertical}
label.chk{display:inline-flex;gap:6px;align-items:center;font-size:15px}

/* Overview */
.stats{display:flex;flex-wrap:wrap;gap:22px;margin:4px 0 6px}
.stat{min-width:90px}
.stat .n{font-family:"Noto Serif SC",serif;font-size:30px;font-weight:800;line-height:1.1}
.stat .l{font-size:13px;color:var(--muted)}
.stat.red .n{color:var(--red)}

/* Progress */
.mod{border-top:1px solid var(--line);padding:14px 0}
.mod:first-child{border-top:0;padding-top:0}
.mod-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.mod-head h3{font-size:17px;min-width:6em}
.bar{flex:1;min-width:120px;height:8px;background:var(--olive-soft);border-radius:4px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .m{background:var(--olive)}
.bar .s{background:color-mix(in srgb,var(--olive) 45%,transparent)}
.pct{font-size:14px;color:var(--muted);min-width:9em;text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.chip .dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--muted)}
.chip[data-s="1"]{background:var(--olive-soft)}
.chip[data-s="1"] .dot{border-color:var(--olive);background:linear-gradient(90deg,var(--olive) 50%,transparent 50%)}
.chip[data-s="2"]{background:var(--olive);color:var(--bg);border-color:var(--olive)}
.chip[data-s="2"] .dot{border-color:var(--bg);background:var(--bg)}
.chip .err{color:var(--red);font-size:12px;font-weight:600}
.chip[data-s="2"] .err{color:var(--bg)}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);margin-bottom:10px;flex-wrap:wrap}

/* Capture */
.drop{border:2px dashed var(--line);border-radius:10px;padding:22px;text-align:center;background:var(--surface)}
.drop.has{border-color:var(--olive)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.thumbs img{width:84px;height:84px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.log{font-size:14px;color:var(--muted);margin-top:10px;white-space:pre-wrap}

/* Mistake card: red pen margin */
.card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--red);border-radius:8px;padding:14px 16px;margin-bottom:12px}
.card.done{border-left-color:var(--olive)}
.card-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:6px}
.tag{background:var(--olive-soft);color:var(--ink);padding:1px 8px;border-radius:4px;font-size:13px}
.tag.red{background:var(--red-soft);color:var(--red)}
.q{white-space:pre-wrap}
.opts{margin:6px 0 0;padding:0;list-style:none}
.opts li{padding:2px 0}
.ans{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:15px}
.ans p{margin:4px 0}
.ans b{color:var(--olive)}
.sim{margin-top:10px;padding:10px 12px;background:var(--bg);border-radius:6px}
.sim h4{margin:0 0 6px;font-size:14px;color:var(--muted);font-weight:600}
details summary{cursor:pointer;color:var(--olive);font-size:14px;margin-top:6px}
.card img.orig{max-height:340px;border-radius:6px;border:1px solid var(--line);margin-top:8px;display:block}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

/* Notes */
.note{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:14px}
.note h3{font-size:17px;margin-bottom:4px}
.md h3{font-size:16px;margin:14px 0 6px}
.md h4{font-size:15px;margin:10px 0 4px}
.md ul,.md ol{padding-left:1.4em;margin:4px 0}
.md p{margin:6px 0}

/* Practice */
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.pprog{font-size:14px;color:var(--muted);margin-bottom:8px}

.tdetail{margin-top:12px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.tdetail h4{margin:0 0 8px;font-size:16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 12px;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--olive);color:var(--bg);font-weight:600}
.chip.on{outline:2px solid var(--olive);outline-offset:1px}
.mini{font-size:14px;border-top:1px dashed var(--line);padding:8px 0}
.drop.over{border-color:var(--olive);background:var(--olive-soft)}
.thumb{position:relative}
.thumb button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--red);color:#fff;font-size:13px;line-height:22px;padding:0}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;margin-top:6px;font-size:15px;line-height:1.5}
.opt:hover{border-color:var(--olive)}
.opt.sel{border-color:var(--olive);background:var(--olive-soft)}
.opt.right{border-color:var(--olive);background:var(--olive);color:var(--bg)}
.opt.wrong{border-color:var(--red);background:var(--red-soft);color:var(--red)}
.opt:disabled{cursor:default}
.verdict{margin-top:10px;font-weight:600}
.verdict.ok{color:var(--olive)} .verdict.bad{color:var(--red)}
.ptimer{float:right;font-variant-numeric:tabular-nums}
.cfg textarea{min-height:200px;font-size:14px;line-height:1.6}
.msg{margin:10px 0;padding:12px 14px;border-radius:10px;border:1px solid var(--line)}
.msg.me{background:var(--olive-soft);margin-left:12%}
.msg.ai{background:var(--surface)}
.msg .who{font-size:13px;color:var(--muted);margin-bottom:2px}
.msg img{max-height:220px;border-radius:6px;display:block;margin-top:6px}
.ctx{font-size:14px;background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:8px 12px;margin-bottom:10px;white-space:pre-wrap;max-height:9em;overflow:auto}
.drillq{border-top:1px solid var(--line);padding:12px 0}
.datenav{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none;position:sticky;top:calc(env(safe-area-inset-top,0px) + 92px);background:var(--bg);z-index:3}
.datenav::-webkit-scrollbar{display:none}
.datenav button{flex:none}
details.day{border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-bottom:10px}
details.day>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;justify-content:space-between;gap:10px;font-weight:600}
details.day>summary::-webkit-details-marker{display:none}
details.day>summary::after{content:"展开";font-weight:400;color:var(--muted);font-size:14px}
details.day[open]>summary::after{content:"收起"}
details.day>summary .sub{font-weight:400;color:var(--muted);font-size:14px;margin-left:auto}
details.day .daybody{padding:0 12px 4px}
.card.last{box-shadow:0 0 0 2px var(--amber)}
.empty{padding:28px 10px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:20;max-width:90vw}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:30;padding:16px}
.modal .box{background:var(--surface);border-radius:12px;padding:16px;max-width:720px;width:100%;max-height:85vh;display:flex;flex-direction:column;gap:10px}
.modal textarea{flex:1;min-height:300px;font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand">
      <h1 id="examTitle">备考工作台</h1>
      <div class="count"><span id="syncDot" class="hint" style="margin-right:10px"></span><span id="countdown"></span></div>
    </div>
    <nav class="tabs" id="tabs">
      <a href="#home">进度</a>
      <a href="#capture">收错题</a>
      <a href="#bank">错题库</a>
      <a href="#ask">答疑</a>
      <a href="#recite">背诵</a>
      <a href="#notes">知识库</a>
      <a href="#practice">练习</a>
      <a href="#export">导出</a>
      <a href="#settings">设置</a>
    </nav>
  </div>
</header>
<main id="view"><p class="hint">正在加载……</p></main>

<script>
(function(){
"use strict";

/* ========== 默认配置（换考试时，去“设置”页改，不用改代码） ========== */
const DEFAULT_EXAM = "军队文职";
const DEFAULT_ABOUT = "数学基础弱，资料分析、数量关系、图形推理是薄弱项；备考时间大约一个月。";
const DEFAULT_MODULES = [
  {id:"yanyu", name:"言语理解", topics:["逻辑填空（实词）","逻辑填空（成语）","片段阅读（主旨概括）","片段阅读（意图判断）","细节理解","语句排序","语句填空"]},
  {id:"shuliang", name:"数量关系", topics:["代入排除","数字特性","比例与倍数","工程问题","行程问题","经济利润","排列组合与概率","几何问题","容斥问题","最值问题"]},
  {id:"panduan", name:"判断推理", topics:["图推：位置规律","图推：样式规律","图推：数量规律","图推：属性规律","图推：空间重构","定义判断","类比推理","逻辑：翻译推理","逻辑：真假推理","逻辑：加强削弱"]},
  {id:"ziliao", name:"资料分析", topics:["基期与现期","增长量","增长率","比重","平均数","倍数","间隔与混合增长","速算：截位直除","速算：特征数字"]},
  {id:"changshi", name:"常识判断", topics:["政治理论","军事常识","法律常识","历史人文","科技地理"]},
  {id:"xinwen", name:"新闻学专业", topics:["新闻学基本理论","新闻采访","新闻写作","新闻编辑与评论","传播学理论","新闻事业史","新闻法规与伦理","军事新闻宣传"]}
];
const API_URL = "https://api.deepseek.com/chat/completions";
const MODEL = "deepseek-flash";
const INTERVALS = [1,2,4,7,15];      // 复习间隔（天）
const MASTER_STREAK = 2;             // 连续做对几次算掌握
const DAY = 86400000;

const S = {
  ready:false, err:"",
  progress:{status:{}, modules:[], examName:DEFAULT_EXAM, about:DEFAULT_ABOUT, examDate:"", daily:{}},
  mistakes:[], notes:[], topics:{},
  ans:{}, chats:[], decks:[], deckProg:{}, rec:null, recList:"", recEdit:null, recGenBusy:false, capOpen:new Set(), capOpenInit:false, showImg:new Set(),
  askUi:{cur:"", input:"", img:null, busy:false, drillBusy:false},
  capture:{files:[], busy:false, log:"", note:""},
  bank:{mod:"all", range:"all", state:"open", q:"", open:new Set()},
  notesUi:{busy:false, range:"today"},
  practice:null,
  exp:{mod:"all", range:"all", scope:"open", sim:true, timer:true},
  topicOpen:"", topicBusy:new Set(), modBusy:"", simBusy:new Set(),
  testMsg:""
};

/* ========== 工具 ========== */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const dayKey = t => {const d=new Date(t);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());};
const fmtDate = t => {const d=new Date(t);return (d.getMonth()+1)+"月"+d.getDate()+"日";};
function startOfToday(){const d=new Date();d.setHours(0,0,0,0);return d.getTime();}
function startOfDay(t){const d=new Date(t);d.setHours(0,0,0,0);return d.getTime();}
function startOfWeek(){const d=new Date();d.setHours(0,0,0,0);const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return d.getTime();}
function inRange(t,r){ if(r==="today") return t>=startOfToday(); if(r==="week") return t>=startOfWeek(); return true; }
const RANGE_TXT = {today:"今天", week:"本周", all:"全部"};
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function newId(p){return p+"_"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
let toastTimer=null;
function toast(msg){let t=$(".toast");if(!t){t=document.createElement("div");t.className="toast";document.body.appendChild(t);}t.textContent=msg;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.remove(),3200);}
const getKey=()=>{try{return localStorage.getItem("ds_key")||"";}catch(_){return "";}};

const MISC={id:"misc",name:"未分类",topics:[]};
const mods=()=>S.progress.modules;
const modById=id=>mods().find(m=>m.id===id);
const modName=id=>(modById(id)||MISC).name;
const allTopics=mid=>{const m=modById(mid);return m?m.topics:[];};
const topicKey=(mid,t)=>mid+"::"+t;
const STATUS_TXT=["没学","学过","掌握"];
const exam=()=>S.progress.examName||"考试";

function md(src){
  const lines=String(src||"").split(/\r?\n/);let html="",list=null;
  const inline=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
  const close=()=>{if(list){html+="</"+list+">";list=null;}};
  for(const raw of lines){
    const l=raw.trimEnd();
    if(/^#{1,2}\s/.test(l)){close();html+="<h3>"+inline(l.replace(/^#+\s/,""))+"</h3>";}
    else if(/^#{3,}\s/.test(l)){close();html+="<h4>"+inline(l.replace(/^#+\s/,""))+"</h4>";}
    else if(/^\s*[-*]\s+/.test(l)){if(list!=="ul"){close();html+="<ul>";list="ul";}html+="<li>"+inline(l.replace(/^\s*[-*]\s+/,""))+"</li>";}
    else if(/^\s*\d+[.、]\s*/.test(l)){if(list!=="ol"){close();html+="<ol>";list="ol";}html+="<li>"+inline(l.replace(/^\s*\d+[.、]\s*/,""))+"</li>";}
    else if(!l.trim()){close();}
    else{close();html+="<p>"+inline(l)+"</p>";}
  }
  close();return html;
}

/* ========== 本地存储 ========== */
const DB={
  db:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open("beikao",1);
    r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains("items"))d.createObjectStore("items",{keyPath:"id"});if(!d.objectStoreNames.contains("images"))d.createObjectStore("images");};
    r.onsuccess=()=>{DB.db=r.result;res();};r.onerror=()=>rej(r.error);});},
  req(store,mode,fn){return new Promise((res,rej)=>{const t=DB.db.transaction(store,mode);const q=fn(t.objectStore(store));t.oncomplete=()=>res(q?q.result:undefined);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);});},
  put(item){item.updatedAt=Date.now();Sync.soon();return DB.req("items","readwrite",s=>s.put(item));},
  putRaw(item){return DB.req("items","readwrite",s=>s.put(item));},
  del(id){Sync.soon();return DB.req("items","readwrite",s=>s.put({id,kind:"tomb",updatedAt:Date.now()}));},
  all(){return DB.req("items","readonly",s=>s.getAll());},
  putImg(id,blob){return DB.req("images","readwrite",s=>s.put(blob,id));},
  getImg(id){return DB.req("images","readonly",s=>s.get(id));},
  delImg(id){return DB.req("images","readwrite",s=>s.delete(id));},
  clear(){return Promise.all([DB.req("items","readwrite",s=>s.clear()),DB.req("images","readwrite",s=>s.clear())]);}
};
function saveFail(e){console.error(e);toast("保存失败：浏览器存储可能已满，先去“设置”导出备份");}
function saveProgress(fresh){const b=JSON.parse(JSON.stringify(S.progress));b.id="progress";b.kind="progress";if(fresh)b.fresh=true;DB.put(b).catch(saveFail);}
function mergeProgress(a,b){
  let base,other;
  if(a.fresh&&!b.fresh){base=b;other=a;}else if(b.fresh&&!a.fresh){base=a;other=b;}
  else{base=(a.updatedAt||0)>=(b.updatedAt||0)?a:b;other=base===a?b:a;}
  const m=JSON.parse(JSON.stringify(base));
  m.status=Object.assign({},other.status||{},base.status||{});
  const daily=Object.assign({},other.daily||{});
  Object.entries(base.daily||{}).forEach(([k,v])=>{const o=daily[k];daily[k]=o?{done:Math.max(o.done||0,v.done||0),right:Math.max(o.right||0,v.right||0)}:v;});
  m.daily=daily;
  if(!m.examDate)m.examDate=other.examDate||"";
  if(!(a.fresh&&b.fresh))delete m.fresh;
  m.updatedAt=Math.max(a.updatedAt||0,b.updatedAt||0);
  return m;
}
const stripTs=x=>{const c=Object.assign({},x);delete c.updatedAt;return JSON.stringify(c,Object.keys(c).sort());};

/* ========== 多设备同步（GitHub 私有仓库） ========== */
const Sync={
  timer:null,busy:false,again:false,status:"",
  cfg(){try{return {repo:(localStorage.getItem("gh_repo")||"").trim(),token:(localStorage.getItem("gh_token")||"").trim()};}catch(_){return {repo:"",token:""};}},
  on(){const c=Sync.cfg();return !!(c.repo&&c.token);},
  soon(){if(!Sync.on())return;clearTimeout(Sync.timer);Sync.timer=setTimeout(()=>Sync.run(),6000);},
  async api(path,opt){
    const c=Sync.cfg();opt=opt||{};
    const r=await fetch("https://api.github.com/repos/"+c.repo+"/contents/"+path,{method:opt.method||"GET",cache:"no-store",
      headers:Object.assign({"Authorization":"Bearer "+c.token,"Accept":opt.raw?"application/vnd.github.raw+json":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"},opt.body?{"Content-Type":"application/json"}:{}),
      body:opt.body?JSON.stringify(opt.body):undefined});
    return r;
  },
  b64FromBytes(bytes){let s="";const ch=0x8000;for(let i=0;i<bytes.length;i+=ch)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+ch));return btoa(s);},
  async listDir(path){
    const r=await Sync.api(path);
    if(r.status===404)return [];
    if(!r.ok)throw Sync.err(r.status);
    const j=await r.json();return Array.isArray(j)?j:[];
  },
  err(code){const e=new Error("gh"+code);e.ui=code===401?"GitHub 口令（token）不对或过期了，去“设置”重新生成一个。":code===403?"GitHub 拒绝访问：检查 token 有没有勾选这个仓库的 Contents 读写权限。":code===404?"找不到这个仓库：检查仓库名是不是“用户名/仓库名”这种写法。":"GitHub 出错（"+code+"）";return e;},
  async fetchImg(id){
    try{const r=await Sync.api("images/"+id+".jpg",{raw:true});if(!r.ok)return null;const b=await r.blob();const blob=new Blob([b],{type:"image/jpeg"});await DB.putImg(id,blob);return blob;}catch(_){return null;}
  },
  async run(manual){
    if(!Sync.on()){if(manual)toast("先填 GitHub 仓库名和 token");return;}
    if(Sync.busy){Sync.again=true;return;}
    Sync.busy=true;Sync.setStatus("正在同步……");
    try{
      const root=await Sync.listDir("");
      const dataEntry=root.find(f=>f.name==="data.json");
      let remote={items:[]};
      if(dataEntry){const r=await Sync.api("data.json",{raw:true});if(!r.ok)throw Sync.err(r.status);remote=JSON.parse(await r.text());}
      const local=await DB.all();
      const L=new Map(local.map(x=>[x.id,x])),R=new Map((remote.items||[]).map(x=>[x.id,x]));
      let pulled=0,pushNeeded=false;const merged=[];
      for(const id of new Set([...L.keys(),...R.keys()])){
        const a=L.get(id),b=R.get(id);
        if(a&&b&&id==="progress"&&a.kind==="progress"&&b.kind==="progress"){
          const m=mergeProgress(a,b);
          if(stripTs(m)!==stripTs(a)){await DB.putRaw(m);pulled++;}
          if(stripTs(m)!==stripTs(b))pushNeeded=true;
          merged.push(m);
        }
        else if(a&&b){
          const ta=a.updatedAt||0,tb=b.updatedAt||0;
          if(tb>ta){await DB.putRaw(b);pulled++;merged.push(b);}
          else{merged.push(a);if(ta>tb)pushNeeded=true;}
        }else if(b){await DB.putRaw(b);pulled++;merged.push(b);}
        else{merged.push(a);pushNeeded=true;}
      }
      if(pushNeeded||!dataEntry){
        const text=JSON.stringify({app:"beikao",version:3,syncedAt:Date.now(),items:merged});
        const r=await Sync.api("data.json",{method:"PUT",body:{message:"同步 "+new Date().toLocaleString("zh-CN"),content:Sync.b64FromBytes(new TextEncoder().encode(text)),sha:dataEntry?dataEntry.sha:undefined}});
        if(r.status===409||r.status===422){Sync.again=true;}
        else if(!r.ok)throw Sync.err(r.status);
      }
      // 图片：把本机有、仓库里没有的传上去
      const need=new Set();
      merged.forEach(x=>{if(x.kind==="mistake")(x.imageIds||[]).forEach(i=>need.add(i));if(x.kind==="chat")(x.messages||[]).forEach(m=>{if(m.imageId)need.add(m.imageId);});});
      if(need.size){
        const have=new Set((await Sync.listDir("images")).map(f=>f.name.replace(/\.jpg$/,"")));
        let n=0;
        for(const id of need){
          if(have.has(id))continue;
          const b=await DB.getImg(id);if(!b)continue;
          Sync.setStatus(`正在上传图片（${++n}）……`);
          const r=await Sync.api("images/"+id+".jpg",{method:"PUT",body:{message:"图片 "+id,content:Sync.b64FromBytes(new Uint8Array(await b.arrayBuffer()))}});
          if(!r.ok&&r.status!==422)throw Sync.err(r.status);
        }
      }
      try{localStorage.setItem("gh_last",String(Date.now()));}catch(_){}
      Sync.setStatus("已同步　"+new Date().toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"}));
      if(pulled)await load(true);
      if(manual)toast(pulled?`同步好了，从别的设备拿到 ${pulled} 条更新`:"同步好了");
    }catch(e){
      console.error(e);
      const msg=e.ui||(e instanceof TypeError?"连不上 GitHub，网络好一点再点“立即同步”。":"同步失败，稍后再试。");
      Sync.setStatus("同步失败："+msg);if(manual)toast(msg);
    }
    Sync.busy=false;
    if(Sync.again){Sync.again=false;setTimeout(()=>Sync.run(),1500);}
  },
  setStatus(t){Sync.status=t;const el=$("#syncStatus");if(el)el.textContent=t;const h=$("#syncDot");if(h)h.textContent=t.startsWith("已同步")?"☁ 已同步":t.startsWith("同步失败")?"☁ 同步失败":Sync.on()?"☁ 同步中":"";}
};
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&Sync.on()&&S.ready)Sync.run();});

function blobToDataURL(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(b);});}
async function askDeepSeek(text,imageDataURL){
  const content=imageDataURL?[{type:"text",text},{type:"image_url",image_url:{url:imageDataURL}}]:text;
  return askMessages([{role:"user",content}]);
}
async function askMessages(messages){
  const key=getKey();
  if(!key){const e=new Error("nokey");e.ui="还没填 DeepSeek API Key，先去“设置”页填好。";throw e;}
  let r;
  try{
    r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},
      body:JSON.stringify({model:MODEL,messages,stream:false})});
  }catch(e){const er=new Error("net");er.ui="连不上 DeepSeek：请检查网络；网络没问题的话，换 Chrome 或 Edge 再试。";throw er;}
  if(!r.ok){
    let detail="";try{const j=await r.json();detail=(j.error&&j.error.message)||"";}catch(_){}
    const map={401:"API Key 不对，去“设置”页重新粘贴。",402:"DeepSeek 账户余额不足，去 DeepSeek 开放平台充值。",429:"请求太频繁，等一分钟再试。",400:"请求被拒绝："+detail};
    const er=new Error("http"+r.status);er.ui=map[r.status]||("DeepSeek 出错（"+r.status+"）"+(detail?"："+detail:""));throw er;
  }
  const j=await r.json();
  return (j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||"";
}
function parseJSON(t){
  let s=String(t||"").replace(/```json|```/g,"").trim();
  const a=s.indexOf("{"),b=s.lastIndexOf("}");if(a>=0&&b>a)s=s.slice(a,b+1);

}

/* ========== 复习节奏 ========== */
function nextDue(x){return x.review&&x.review.next?x.review.next:startOfDay(x.createdAt)+DAY;}
function isDue(x){return !x.mastered&&nextDue(x)<=Date.now();}
function logDaily(ok){
  const k=dayKey(Date.now());const d=S.progress.daily[k]||{done:0,right:0};d.done++;if(ok)d.right++;S.progress.daily[k]=d;saveProgress();
}
function streakDays(){
  let t=startOfToday();if(!(S.progress.daily[dayKey(t)]||{}).done)t-=DAY;
  let n=0;while((S.progress.daily[dayKey(t)]||{}).done){n++;t-=DAY;}return n;
}
function applyResult(x,ok){
  const st=Object.assign({right:0,wrong:0},x.stats||{});const rv=Object.assign({stage:0,next:0},x.review||{});
  if(ok){st.right++;x.streak=(x.streak||0)+1;rv.stage=Math.min(rv.stage+1,INTERVALS.length-1);rv.next=startOfToday()+INTERVALS[rv.stage]*DAY;if(x.streak>=MASTER_STREAK)x.mastered=true;}
  else{st.wrong++;x.streak=0;rv.stage=0;rv.next=startOfToday()+DAY;x.mastered=false;}
  st.lastAt=Date.now();x.stats=st;x.review=rv;saveMistake(x);
}
function qToMistake(q,meta){
  const doc=Object.assign({id:newId("m"),kind:"mistake",createdAt:Date.now(),
    question:q.question,options:q.options||[],answer:q.answer,myAnswer:"",analysis:q.analysis,
    similar:[],imageIds:[],mastered:false,streak:0,stats:{right:0,wrong:1},
    review:{stage:0,next:startOfToday()+DAY}},meta);
  S.mistakes.unshift(doc);saveMistake(doc);return doc;
}
function simToMistake(x,s){
  const doc={id:newId("m"),kind:"mistake",createdAt:Date.now(),module:x.module,topic:x.topic,
    question:s.question,options:s.options||[],answer:s.answer,myAnswer:"",analysis:s.analysis,
    knowledge:x.knowledge,method:x.method,trap:x.trap,reason:"同类题做错，自动收入",
    similar:[],imageIds:[],mastered:false,streak:0,stats:{right:0,wrong:1},
    review:{stage:0,next:startOfToday()+DAY},fromId:x.id};
  S.mistakes.unshift(doc);saveMistake(doc);return doc;
}

/* ========== 做题组件 ========== */
function letters(ans){const m=String(ans||"").toUpperCase().replace(/[\s,，、.．:：]/g,"").match(/^[A-H]+/);return m?Array.from(new Set(m[0].split(""))).sort():[];}
function optLetter(o,i){const m=String(o).trim().match(/^([A-Ha-h])(?=[\s.．、:：)）]|$)/);return m?m[1].toUpperCase():"ABCDEFGH"[i];}
function resolveQ(qid){
  const p=qid.split("|");
  if(p[0]==="d"){const c=S.chats.find(c=>c.id===p[1]);const q=c&&c.drill[Number(p[2])];return q?{chat:c,q,kind:"drill"}:null;}const x=S.mistakes.find(m=>m.id===p[1]);if(!x)return null;
  if(p[0]==="o")return {x,q:x,kind:"orig"};
  const s=(x.similar||[])[Number(p[2])];return s?{x,q:s,kind:"sim",idx:Number(p[2])}:null;
}
function qBlock(qid,q){
  const st=S.ans[qid]||{picked:[]};const ansL=letters(q.answer);const opts=q.options||[];
  const choice=opts.length>0&&ansL.length>0;const multi=ansL.length>1;
  let h=`<div class="q">${esc(q.question)}</div>`;
  if(choice){
    h+=opts.map((o,i)=>{const L=optLetter(o,i);let c="";
      if(st.done){if(ansL.includes(L))c="right";else if(st.picked.includes(L))c="wrong";}
      else if(st.picked.includes(L))c="sel";
      return `<button class="opt ${c}" data-act="pick" data-qid="${esc(qid)}" data-l="${L}" ${st.done?"disabled":""}>${esc(o)}</button>`;}).join("");
    if(multi&&!st.done)h+=`<div class="actions"><span class="hint">多选题，选完点提交</span><button class="btn small primary" data-act="submit" data-qid="${esc(qid)}">提交</button></div>`;
  }else{
    if(opts.length)h+=`<ul class="opts">${opts.map(o=>`<li>${esc(o)}</li>`).join("")}</ul>`;
    if(!st.done&&!st.revealed)h+=`<div class="actions"><button class="btn small primary" data-act="reveal" data-qid="${esc(qid)}">做完了，看答案</button></div>`;
  }
  if(st.revealed&&!st.done){
    h+=`<div class="ans"><p><b>答案：</b>${esc(q.answer)}</p>${q.analysis?`<p>${esc(q.analysis)}</p>`:""}</div><div class="actions"><button class="btn small primary" data-act="self" data-ok="1" data-qid="${esc(qid)}">我做对了</button><button class="btn small red" data-act="self" data-ok="0" data-qid="${esc(qid)}">我做错了</button></div>`;
  }
  if(st.done){
    h+=`<div class="verdict ${st.ok?"ok":"bad"}">${st.ok?"✓ 做对了":"✗ 做错了，正确答案："+esc(q.answer)}${st.secs!=null?`<span class="hint" style="font-weight:400">　用时 ${st.secs} 秒</span>`:""}</div>`;
    if(!st.revealed&&q.analysis)h+=`<div class="ans"><p>${esc(q.analysis)}</p></div>`;
    if(st.note)h+=`<p class="hint">${esc(st.note)}</p>`;
  }
  return h;
}
function judge(qid,ok){
  const r=resolveQ(qid);if(!r)return;const st=S.ans[qid]||(S.ans[qid]={picked:[]});
  if(st.done)return;
  if(ok==null)ok=JSON.stringify(st.picked.slice().sort())===JSON.stringify(letters(r.q.answer));
  st.done=true;st.ok=ok;if(st.start)st.secs=Math.round((Date.now()-st.start)/1000);
  logDaily(ok);
  if(r.kind==="drill"){
    if(!ok&&!r.q.added){r.q.added=true;saveChat(r.chat);
      qToMistake(r.q,{module:modById(r.q.module)?r.q.module:"misc",topic:r.q.topic||"",knowledge:r.chat.drillFocus||"",method:"",trap:"",reason:"答疑后的练习做错，自动收入",fromChat:r.chat.id});
      st.note="这道题已收进错题库，之后会按复习节奏再出现。";}
  }
  else if(r.kind==="orig"){applyResult(r.x,ok);st.note=ok?(r.x.mastered?"连续做对，已自动算作掌握。":"再做对一次就算掌握。"):"已重新排进明天的复习。";}
  else if(!ok){
    if(!r.q.added){r.q.added=true;saveMistake(r.x);simToMistake(r.x,r.q);st.note="这道同类题已收进错题库。";}
    else st.note="这道题之前已经收进错题库了。";
  }
  if(current()==="capture"&&r.kind!=="drill")setLast(r.x.id);
  if(S.practice&&current()==="practice"){const p=S.practice;ok?p.right++:p.wrong++;}
  rerender();
}

function topicDetail(mid,t){

}

const BOX_DAYS=[0,1,2,4,7,15];
function allDecks(){return BUILTIN_DECKS.concat(S.decks||[]);}
function deckById(id){return allDecks().find(d=>d.id===id);}
function prog(id){return S.deckProg[id]||(S.deckProg[id]={id:"dp::"+id,kind:"deckprog",deck:id,cards:{},best:null});}
function saveProg(id){DB.put(prog(id)).catch(saveFail);}
function cardDue(dp,c){const p=dp.cards[c.id];return !p||p.next<=Date.now();}
function deckDue(d){const dp=prog(d.id);return d.cards.filter(c=>dp.cards[c.id]&&cardDue(dp,c)).length;}
function deckNew(d){const dp=prog(d.id);return d.cards.filter(c=>!dp.cards[c.id]).length;}
function deckLearned(d){const dp=prog(d.id);return d.cards.filter(c=>(dp.cards[c.id]||{}).box>=3).length;}
function totalDue(){return allDecks().reduce((n,d)=>n+deckDue(d),0);}
function grade(deckId,cardId,level){
  const dp=prog(deckId);const p=dp.cards[cardId]||{box:0,next:0,r:0,w:0};
  if(level===2){p.box=Math.min(p.box+1,BOX_DAYS.length-1);p.r++;}
  else if(level===1){p.box=Math.max(p.box,1);}
  else{p.box=0;p.w++;}
  p.next=startOfToday()+BOX_DAYS[p.box]*DAY+(p.box===0?0:0);
  dp.cards[cardId]=p;saveProg(deckId);
}
function norm(s){return String(s||"").replace(/[\uff10-\uff19]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/[％]/g,"%").replace(/[×]/g,"*").replace(/[÷]/g,"/").replace(/[（]/g,"(").replace(/[）]/g,")").replace(/[－—–]/g,"-").replace(/[＝]/g,"=").replace(/[＋]/g,"+").replace(/\s+/g,"").toLowerCase();}
function numCheck(card,input){
  const m=norm(input).replace(/^1\//,"").match(/-?\d+(\.\d+)?/);if(!m)return false;
  return Math.abs(parseFloat(m[0])-card.num)<=card.tol+1e-9;
}

function startRec(deckId,mode){
  const d=deckById(deckId);if(!d)return;const dp=prog(deckId);
  let q;
  if(mode==="speed"){q=shuffle(d.cards.slice()).slice(0,20).map(c=>c.id);}
  else{
    const due=shuffle(d.cards.filter(c=>dp.cards[c.id]&&cardDue(dp,c)));
    const nw=d.cards.filter(c=>!dp.cards[c.id]);
    q=due.concat(nw).slice(0,20).map(c=>c.id);
    if(!q.length){if(!confirm("这个卡组今天没有要背的了。要不要全部再过一遍？"))return;q=shuffle(d.cards.slice()).slice(0,20).map(c=>c.id);}
  }
  S.rec={deckId,mode,q,i:0,shown:false,input:"",judged:null,right:0,wrong:0,wrongs:[],start:Date.now()};render();focusRec();
}
function focusRec(){setTimeout(()=>{const el=$("#recIn");if(el)el.focus();},30);}
function viewRecSession(){
  const r=S.rec,d=deckById(r.deckId);
  if(!d){S.rec=null;return viewRecite();}
  if(r.i>=r.q.length){
    const secs=Math.round((Date.now()-r.start)/1000);
    let extra="";
    if(r.mode==="speed"){const dp=prog(d.id);const acc=r.right/r.q.length;if(acc>=0.9&&(!dp.best||secs<dp.best.secs)){dp.best={secs,acc:Math.round(acc*100),at:Date.now()};saveProg(d.id);extra=`<p class="verdict ok">新纪录！</p>`;}}
    return `<section class="section"><h2>这一组完成了</h2><div class="pcard"><div class="stats"><div class="stat"><div class="n">${r.right}</div><div class="l">${r.mode==="flash"?"记得":"对了"}</div></div><div class="stat red"><div class="n">${r.wrong}</div><div class="l">${r.mode==="flash"?"模糊或忘了":"错了"}</div></div><div class="stat"><div class="n">${secs}</div><div class="l">用时（秒）</div></div></div>${extra}
      ${r.wrongs.length?`<h4 style="margin:14px 0 6px">要再看看的</h4>${r.wrongs.map(id=>{const c=d.cards.find(x=>x.id===id);return c?`<div class="mini"><b>${esc(c.front)}</b>　${esc(c.back)}</div>`:"";}).join("")}`:""}
      <div class="actions"><button class="btn primary" data-act="recStart" data-deck="${d.id}" data-mode="${r.mode}">再来一组</button><button class="btn" data-act="recExit">回到卡组</button></div></div></section>`;
  }
  const c=d.cards.find(x=>x.id===r.q[r.i]);
  if(!c){r.i++;return viewRecSession();}
  const head=`<div class="pprog">${esc(d.name)}・${r.mode==="flash"?"背诵":r.mode==="write"?"默写":"速算挑战"}　第 ${r.i+1}／${r.q.length} 张${r.mode==="speed"?`<span class="ptimer" id="rtimer">0 秒</span>`:""}</div>`;
  const front=`<div style="font-size:24px;font-weight:600;margin:6px 0 14px">${esc(c.front)}</div>`;
  let body="";
  if(r.mode==="flash"){
    body=r.shown?`<div class="ans" style="font-size:19px">${esc(c.back)}</div><div class="actions"><button class="btn red" data-act="recGrade" data-v="0">忘了（1）</button><button class="btn" data-act="recGrade" data-v="1">模糊（2）</button><button class="btn primary" data-act="recGrade" data-v="2">记得（3）</button></div>`
      :`<div class="actions"><button class="btn primary" data-act="recShow">看答案（空格）</button></div>`;
  }else{
    const numeric=c.num!=null;
    if(r.judged==null){
      body=`<input type="text" id="recIn" value="${esc(r.input)}" placeholder="${numeric?"写数字就行，比如 14.3":"把答案写出来"}" style="width:100%;font-size:18px" autocomplete="off" ${numeric?'inputmode="decimal"':""}><div class="actions"><button class="btn primary" data-act="recSubmit">提交（回车）</button>${r.mode==="write"?`<button class="btn" data-act="recGiveUp">不会，看答案</button>`:""}</div>`;
    }else if(r.judged==="ask"){
      body=`<div class="ans"><p><b>我写的：</b>${esc(r.input)||"（没写）"}</p><p><b>标准答案：</b>${esc(c.back)}</p></div><div class="actions"><button class="btn red" data-act="recSelf" data-v="0">没写对</button><button class="btn primary" data-act="recSelf" data-v="2">意思对了</button></div>`;
    }else{
      body=`<div class="verdict ${r.judged?"ok":"bad"}">${r.judged?"✓ 对了":"✗ 不对"}　标准答案：${esc(c.back)}</div>${r.judged?"":`<p class="hint">我写的：${esc(r.input)||"（没写）"}</p>`}<div class="actions"><button class="btn primary" data-act="recNext">下一张（回车）</button></div>`;
    }
  }
  return `<section class="section">${head}<div class="pcard">${front}${body}<div class="actions"><button class="btn small" data-act="recExit">结束</button></div></div></section>`;
}
function recAdvance(ok,level){
  const r=S.rec,c=r.q[r.i];
  if(r.mode!=="speed")grade(r.deckId,c,level);
  if(ok)r.right++;else{r.wrong++;r.wrongs.push(c);}
  r.i++;r.shown=false;r.input="";r.judged=null;render();focusRec();
}
function recSubmit(){
  const r=S.rec,d=deckById(r.deckId),c=d.cards.find(x=>x.id===r.q[r.i]);
  const el=$("#recIn");r.input=el?el.value.trim():r.input;
  if(c.num!=null){
    const ok=numCheck(c,r.input);
    if(r.mode==="speed"){toast(ok?"✓":"✗ "+c.back);recAdvance(ok,ok?2:0);return;}
    r.judged=ok;r._level=ok?2:0;
  }else{
    r.judged=norm(r.input)&&norm(r.input)===norm(c.back)?true:"ask";r._level=2;
  }
  render();
}
function parseCards(text){
  return text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map((l,i)=>{const k=l.search(/[｜|]/);return k>0?{id:"c"+Date.now().toString(36)+i,front:l.slice(0,k).trim(),back:l.slice(k+1).trim()}:null;}).filter(c=>c&&c.front&&c.back);
}
async function recGen(){
  const topic=($("#recTopic").value||"").trim();if(!topic){toast("先写主题");return;}
  const nameEl=$("#recName"),cardsEl=$("#recCards");
  S.recEdit=Object.assign(S.recEdit||{},{name:nameEl.value||topic,text:cardsEl.value});
  S.recGenBusy=true;render();
  try{
    const prompt=`你是${exam()}笔试的辅导老师。考生情况：${S.progress.about||"无"}
请围绕“${topic}”出 15 张背诵卡，挑考试最常考、最需要背下来的内容。每张卡：正面是一个简短的问题或名词，背面是能直接背的答案，40 字以内，中文全角标点。内容必须准确，拿不准的不要写。
只输出一个 JSON 对象，不要任何其他文字，格式：{"cards":[{"front":"","back":""}]}`;
    const res=parseJSON(await askDeepSeek(prompt));
    const lines=(Array.isArray(res.cards)?res.cards:[]).filter(c=>c&&c.front&&c.back).map(c=>String(c.front).replace(/[｜|]/g,"／")+"｜"+String(c.back).replace(/[｜|]/g,"／"));
    if(!lines.length)throw Object.assign(new Error("e"),{ui:"没生成成功，再试一次"});
    S.recEdit.text=(S.recEdit.text?S.recEdit.text.trim()+"\n":"")+lines.join("\n");
    toast("生成好了，检查一下再保存");
  }catch(e){console.error(e);toast(e.ui||"生成失败，再试一次");}
  S.recGenBusy=false;render();
}
function recSave(){
  const name=$("#recName").value.trim(),cards=parseCards($("#recCards").value);
  if(!name){toast("给卡组起个名字");return;}
  if(!cards.length){toast("至少写一张卡，格式是“正面｜背面”");return;}
  const ed=S.recEdit;
  if(ed&&ed.id){const d=S.decks.find(x=>x.id===ed.id);if(d){
      const old=new Map(d.cards.map(c=>[c.front,c.id]));cards.forEach(c=>{if(old.has(c.front))c.id=old.get(c.front);});
      d.name=name;d.cards=cards;DB.put(d).catch(saveFail);}}
  else{const d={id:newId("deck"),kind:"deck",createdAt:Date.now(),name,cards};S.decks.push(d);DB.put(d).catch(saveFail);}
  S.recEdit=null;render();toast("卡组已保存");
}

const WEEK="日一二三四五六";
function lastId(){try{return localStorage.getItem("cap_last")||"";}catch(_){return "";}}
function setLast(id){try{localStorage.setItem("cap_last",id);}catch(_){}}
function dayGroups(){const g=new Map();S.mistakes.forEach(x=>{const k=dayKey(x.createdAt);if(!g.has(k))g.set(k,[]);g.get(k).push(x);});return g;}
function dayLabel(k){const d=new Date(k+"T00:00:00");return k===dayKey(Date.now())?"今天":(d.getMonth()+1)+"月"+d.getDate()+"日";}
function recentHtml(){
  const g=dayGroups();if(!g.size)return `<div class="empty">还没有错题，拍一张试试。</div>`;
  const keys=[...g.keys()];
  if(!S.capOpenInit){S.capOpen=new Set([keys[0]]);const l=S.mistakes.find(x=>x.id===lastId());if(l)S.capOpen.add(dayKey(l.createdAt));S.capOpenInit=true;}
  const L=S.mistakes.find(x=>x.id===lastId());

  return nav+keys.map(k=>{
    const list=g.get(k),d=new Date(k+"T00:00:00"),open=S.capOpen.has(k);
    const left=list.filter(x=>!x.mastered).length;
    return `<details class="day" id="day-${k}" data-day="${k}" ${open?"open":""}><summary>${dayLabel(k)}（周${WEEK[d.getDay()]}）<span class="sub">${list.length} 道，没掌握 ${left}</span></summary><div class="daybody">${open?list.map(cardHtml).join(""):""}</div></details>`;
  }).join("");
}
function scrollToEl(el){if(!el)return;const top=el.getBoundingClientRect().top+window.scrollY-150;window.scrollTo({top,behavior:"smooth"});}
function goLast(){
  const x=S.mistakes.find(m=>m.id===lastId());if(!x)return;

document.addEventListener("toggle",e=>{

      <p class="hint" style="margin-top:0">题目打乱顺序。电脑上可以直接按键盘 A、B、C、D 作答，按回车进入下一题。</p>

  }
  if(p.i>=p.deck.length){
    const rate=p.right+p.wrong?Math.round(p.right/(p.right+p.wrong)*100):0;
    return `<section class="section"><h2>这一轮做完了</h2><div class="pcard"><div class="stats"><div class="stat"><div class="n">${p.right}</div><div class="l">做对</div></div><div class="stat red"><div class="n">${p.wrong}</div><div class="l">做错</div></div><div class="stat"><div class="n">${rate}%</div><div class="l">正确率</div></div></div><div class="actions"><button class="btn primary" data-act="endPractice">再来一轮</button></div></div></section>`;
  }
  const qid=p.deck[p.i],r=resolveQ(qid);
  if(!r){p.i++;return viewPractice();}
  const st=S.ans[qid]||(S.ans[qid]={picked:[],start:Date.now()});
  const imgs=r.kind==="orig"?imgToggle(r.x):"";
  return `<section class="section"><div class="pprog">第 ${p.i+1}／${p.deck.length} 题　${esc(modName(r.x.module))}・${esc(r.x.topic||"")}${r.kind==="sim"?"　同类题":""}${e.timer&&!st.done?`<span class="ptimer" id="ptimer">0 秒</span>`:""}</div>
    <div class="pcard">${qBlock(qid,r.q)}${imgs}
    ${st.done&&r.kind==="orig"&&r.x.method?`<p><b>方法：</b>${esc(r.x.method)}</p>`:""}
    <div class="actions">${st.done?`<button class="btn primary" data-act="next">下一题（回车）</button>`:""}<button class="btn" data-act="endPractice">结束</button></div>
    </div></section>`;
}
function startPracticeWith(list,includeSim){
  const deck=[];list.forEach(x=>{deck.push("o|"+x.id);if(includeSim)(x.similar||[]).forEach((s,i)=>{if(!s.added)deck.push("s|"+x.id+"|"+i);});});
  if(!deck.length){toast("没有符合条件的题");return;}
  deck.forEach(q=>delete S.ans[q]);
  S.practice={deck:shuffle(deck),i:0,right:0,wrong:0};
  if(current()!=="practice")location.hash="#practice";else render();
}

document.addEventListener("keydown",e=>{
  if(current()==="recite"&&S.rec){
    const r=S.rec;
    if(e.target&&e.target.id==="recIn"){if(e.key==="Enter"){e.preventDefault();recSubmit();}return;}
    if(e.target&&(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA"))return;
    if(r.mode==="flash"){if(!r.shown&&(e.key===" "||e.key==="Enter")){e.preventDefault();r.shown=true;render();}else if(r.shown&&["1","2","3"].includes(e.key)){const v=Number(e.key)-1;recAdvance(v===2,v);}}
    else if(r.judged===true||r.judged===false){if(e.key==="Enter"){e.preventDefault();recAdvance(!!r.judged,r.judged?r._level:0);}}
    return;
  }
  if(e.target&&e.target.id==="askIn"&&e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault();sendAsk();return;}
  if(current()!=="practice"||!S.practice)return;
  const t=e.target;if(t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA"||t.tagName==="SELECT"))return;
  const p=S.practice;if(p.i>=p.deck.length)return;
  const qid=p.deck[p.i],st=S.ans[qid];
  if(e.key==="Enter"){if(st&&st.done){p.i++;render();window.scrollTo(0,0);}else{const r=resolveQ(qid);if(r&&letters(r.q.answer).length>1&&st&&st.picked.length)judge(qid);}e.preventDefault();return;}
  const L=e.key.toUpperCase();
  if(/^[A-H]$/.test(L)){const b=document.querySelector(`.opt[data-qid="${CSS.escape(qid)}"][data-l="${L}"]`);if(b&&!b.disabled)b.click();}
});

function saveCfg(){
  const name=$("#cfgExam").value.trim()||"考试";const about=$("#cfgAbout").value.trim();
  const lines=$("#cfgMods").value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const out=[];
  for(const [i,l] of lines.entries()){
    const cut=l.search(/[：:]/);const mname=(cut>=0?l.slice(0,cut):l).trim();if(!mname)continue;
    const topics=cut>=0?Array.from(new Set(l.slice(cut+1).split(/[、，,；;]/).map(t=>t.trim()).filter(Boolean))):[];
    const old=mods().find(m=>m.name===mname);
    out.push({id:old?old.id:"u"+Date.now().toString(36)+i,name:mname,topics});
  }
  if(!out.length){toast("至少要有一个模块");return;}
  Object.assign(S.progress,{examName:name,about,modules:out});saveProgress();S.topicOpen="";render();toast("考试设置已保存");
}

  if(ev.target.id==="askIn"){S.askUi.input=ev.target.value;}
  if(ev.target.id==="recName"||ev.target.id==="recCards"){S.recEdit=Object.assign(S.recEdit||{},{name:$("#recName").value,text:$("#recCards").value});}
});

/* ========== 收错题：选图、拖拽、粘贴 ========== */
function bindCapture(){
  const fi=$("#fileIn");
  $("#pick").onclick=()=>fi.click();
  fi.onchange=()=>{addFiles(fi.files);fi.value="";};
  $("#runCap").onclick=runCapture;
  drawThumbs();
}
function addFiles(list){
  const imgs=Array.from(list||[]).filter(f=>f&&f.type&&f.type.startsWith("image/"));
  if(!imgs.length){toast("没有找到图片。从微信拖不进来的话，在微信里右键图片“复制”，再回这里按 Ctrl＋V");return false;}
  S.capture.files=S.capture.files.concat(imgs);drawThumbs();toast(`已加入 ${imgs.length} 张，共 ${S.capture.files.length} 张待识别`);return true;
}
document.addEventListener("dragover",e=>{e.preventDefault();const d=$("#drop");if(d)d.classList.add("over");});
document.addEventListener("dragleave",e=>{if(!e.relatedTarget){const d=$("#drop");if(d)d.classList.remove("over");}});
document.addEventListener("drop",e=>{
  e.preventDefault();const d=$("#drop");if(d)d.classList.remove("over");
  if(S.capture.busy)return;
  const files=e.dataTransfer&&e.dataTransfer.files?Array.from(e.dataTransfer.files):[];
  if(!files.length)return;
  if(current()==="ask"){const f=files.find(f=>f.type&&f.type.startsWith("image/"));if(f){S.askUi.img=f;rerender();}return;}
  if(current()!=="capture"){location.hash="#capture";setTimeout(()=>addFiles(files),50);}else addFiles(files);
});
document.addEventListener("paste",e=>{
  const items=Array.from((e.clipboardData&&e.clipboardData.items)||[]).filter(i=>i.kind==="file"&&i.type.startsWith("image/")).map(i=>i.getAsFile()).filter(Boolean);
  if(!items.length)return;
  e.preventDefault();
  if(current()==="ask"){S.askUi.img=items[0];rerender();return;}
  if(S.capture.busy)return;
  const named=items.map((f,i)=>new File([f],`粘贴_${Date.now()}_${i}.png`,{type:f.type}));
  if(current()!=="capture"){location.hash="#capture";setTimeout(()=>addFiles(named),50);}else addFiles(named);
});
function drawThumbs(){
  const t=$("#thumbs");if(!t)return;t.innerHTML="";
  S.capture.files.forEach((f,i)=>{const w=document.createElement("span");w.className="thumb";const img=document.createElement("img");img.alt="待识别";img.src=URL.createObjectURL(f);const x=document.createElement("button");x.textContent="×";x.title="移除这张";x.onclick=()=>{S.capture.files.splice(i,1);drawThumbs();};w.appendChild(img);w.appendChild(x);t.appendChild(w);});
  const d=$("#drop");if(d)d.classList.toggle("has",S.capture.files.length>0);
}
async function shrink(file){
  try{
    const bmp=await createImageBitmap(file);const max=1600;const r=Math.min(1,max/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas");c.width=Math.round(bmp.width*r);c.height=Math.round(bmp.height*r);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(res=>c.toBlob(b=>res(b||file),"image/jpeg",0.85));
  }catch(e){return file;}
}
function moduleListText(){return mods().map(m=>`${m.id}（${m.name}）：${m.topics.join("、")}`).join("\n");}
function capLog(s){S.capture.log=s;const el=$("#capLog");if(el)el.textContent=s;}
const SIM_RULE="similar：2道同知识点、同难度的原创题，每道含 question、options、answer、analysis；选择题的 answer 只写选项字母（多选就写多个字母，如 AC），options 每项以“A. ”这种形式开头；图片类题目无法出图时，改成用文字描述图形的规律辨析题";

async function runCapture(){
  const c=S.capture;
  if(!c.files.length){toast("先放一张错题图片");return;}
  if(!getKey()){toast("先去“设置”页填 DeepSeek API Key");return;}
  c.busy=true;render();
  let saved=0;const total=c.files.length;const logs=[];
  for(let i=0;i<total;i++){
    capLog(logs.concat([`正在识别第 ${i+1}／${total} 张，每张大约要半分钟……`]).join("\n"));
    try{
      const blob=await shrink(c.files[i]);
      const dataURL=await blobToDataURL(blob);
      const prompt=`你是${exam()}笔试的辅导老师。考生情况：${S.progress.about||"无"}
图片是考生做错的题目的截图或照片。
${c.note?"考生补充说明："+c.note+"\n":""}请识别图中题目：如果考生说明里指定了题号，只处理那几道；否则处理图中所有完整的题目。
对每道题输出一个对象，字段如下：
module：从下面模块清单的英文代号里选一个
topic：从该模块的知识点里选最贴切的一个，原样照抄；实在没有合适的，写一个简短的新知识点名
question：题干原文。资料分析类题写设问，并用两三句话写出解题必需的材料数据；图形类题用文字描述每个图形的关键特征
options：选项数组，每项以“A. ”这种形式开头；没有选项就给空数组
answer：正确答案；选择题只写选项字母（多选写多个字母，如 AC）。图片里有答案就照图片，没有就自己仔细解出来
myAnswer：考生选的答案字母，看不出就给空字符串
analysis：解析，200字以内；计算题写最快的估算路径，不要硬算
knowledge：考的知识点或规律，一句话
method：可以反复套用的解题方法或口诀，一两句
trap：最常见的错因，一句话
${SIM_RULE}
模块清单：
${moduleListText()}
只输出一个 JSON 对象，不要任何其他文字，格式：{"items":[ ... ]}`;
      const raw=await askDeepSeek(prompt,dataURL);
      let res;try{res=parseJSON(raw);}catch(_){throw Object.assign(new Error("parse"),{ui:"DeepSeek 返回的格式不对，再试一次。"});}
      const items=Array.isArray(res.items)?res.items:[];
      if(!items.length){logs.push(`第 ${i+1} 张：没识别出题目，换一张更清楚的图试试。`);continue;}
      const imgId=newId("img");await DB.putImg(imgId,blob);
      for(const it of items){
        const doc={id:newId("m"),kind:"mistake",createdAt:Date.now(),module:modById(it.module)?it.module:"misc",topic:String(it.topic||"").slice(0,40),
          question:String(it.question||""),options:Array.isArray(it.options)?it.options.map(String):[],
          answer:String(it.answer||""),myAnswer:String(it.myAnswer||""),analysis:String(it.analysis||""),
          knowledge:String(it.knowledge||""),method:String(it.method||""),trap:String(it.trap||""),reason:c.note||"",
          similar:Array.isArray(it.similar)?it.similar.slice(0,3).map(cleanQ):[],
          imageIds:[imgId],mastered:false,streak:0,stats:{right:0,wrong:0},review:{stage:0,next:startOfToday()+DAY}};
        await DB.put(doc);S.mistakes.unshift(doc);saved++;
      }
      logs.push(`第 ${i+1} 张：存入 ${items.length} 道。`);
    }catch(e){
      console.error(e);logs.push(`第 ${i+1} 张：${e.ui||"识别失败，可以再试一次。"}`);
      if(fatal(e))break;
    }
  }
  c.busy=false;c.files=[];c.note="";
  S.capture.log=logs.join("\n")+(saved?`\n一共存入 ${saved} 道错题，明天会出现在“今天该复习”里。`:"");
  render();
}
async function moreSim(id){
  const x=S.mistakes.find(m=>m.id===id);if(!x)return;
  S.simBusy.add(id);rerender();
  try{
    const prompt=`你是${exam()}笔试的辅导老师。下面是考生做错的一道题，请再出 2 道同知识点、同难度、但和已有同类题不重复的原创题。
原题：${x.question}
选项：${(x.options||[]).join("　")}
答案：${x.answer}
知识点：${x.topic}，${x.knowledge}
已有同类题：${(x.similar||[]).map(s=>s.question.slice(0,60)).join("｜")||"无"}
${SIM_RULE}
只输出一个 JSON 对象，不要任何其他文字，格式：{"similar":[ ... ]}`;
    const res=parseJSON(await askDeepSeek(prompt));
    const add=(Array.isArray(res.similar)?res.similar:[]).slice(0,3).map(cleanQ).filter(s=>s.question);
    if(!add.length)throw Object.assign(new Error("empty"),{ui:"没出成功，再试一次。"});
    x.similar=(x.similar||[]).concat(add);saveMistake(x);toast(`加了 ${add.length} 道同类题`);
  }catch(e){console.error(e);toast(e.ui||"出题失败，再试一次");}
  S.simBusy.delete(id);rerender();
}

/* ========== 整理知识卡 ========== */

请把它整理成一份可背诵的复习卡，用 Markdown，中文全角标点，不要寒暄：

/* ========== 导出与备份 ========== */
function saveFile(filename,data,mime){
  const blob=data instanceof Blob?data:new Blob([data],{type:mime});
  const url=URL.createObjectURL(blob);const a=document.createElement("a");
  a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),5000);
}
function paperItems(){
  const e=S.exp;const list=filterList({mod:e.mod,range:e.range,state:e.scope,q:""});
  const items=[];list.forEach(x=>{items.push({x,q:x,src:"原题"});if(e.sim)(x.similar||[]).forEach(s=>{if(!s.added)items.push({x,q:s,src:"同类题"});});});
  return shuffle(items);
}
function exportPaper(kind){
  const items=paperItems();if(!items.length)return;
  const d=new Date(),stamp=dayKey(d);
  const title=`${exam()}错题重练卷（${d.getMonth()+1}月${d.getDate()}日，${items.length}题）`;
  if(kind==="md"){
    let s=`# ${title}\n\n`;
    items.forEach((it,i)=>{s+=`**${i+1}.**【${modName(it.x.module)}・${it.x.topic||""}】${it.src==="原题"&&(it.x.imageIds||[]).length&&it.x.module==="panduan"?"（原题有图）":""}\n\n${it.q.question}\n\n${(it.q.options||[]).join("\n")}\n\n`;});
    s+=`---\n\n# 答案与解析\n\n`;
    items.forEach((it,i)=>{s+=`**${i+1}.** 答案：${it.q.answer}\n${it.q.analysis||""}${it.src==="原题"&&it.x.method?`\n方法：${it.x.method}`:""}\n\n`;});
    saveFile(`错题重练卷_${stamp}.md`,s,"text/markdown");
  }else{
    const qs=items.map((it,i)=>`<div class="q"><p><b>${i+1}.</b> <small>【${esc(modName(it.x.module))}・${esc(it.x.topic||"")}】</small></p><p>${esc(it.q.question).replace(/\n/g,"<br>")}</p>${(it.q.options||[]).map(o=>`<p>${esc(o)}</p>`).join("")}</div>`).join("");
    const as=items.map((it,i)=>`<p><b>${i+1}.</b> 答案：${esc(it.q.answer)}　${esc(it.q.analysis||"")}</p>`).join("");
    const html=`<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>${esc(title)}</title><style>body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;max-width:760px;margin:24px auto;padding:0 16px;line-height:1.7;color:#222}h1{font-size:22px}.q{margin-bottom:18px;page-break-inside:avoid}small{color:#777}.ak{page-break-before:always}</style></head><body><h1>${esc(title)}</h1>${qs}<div class="ak"><h1>答案与解析</h1>${as}</div></body></html>`;
    saveFile(`错题重练卷_${stamp}.html`,html,"text/html");
  }
}
function exportKnowledge(){
  const e=S.exp;const d=new Date();
  let s=`# ${exam()}知识库（导出于 ${d.getMonth()+1}月${d.getDate()}日）\n\n`;
  const tkeys=mods().filter(m=>e.mod==="all"||m.id===e.mod).flatMap(m=>m.topics.map(t=>topicKey(m.id,t))).filter(k=>S.topics[k]);
  if(tkeys.length){s+=`## 知识点要点\n\n`;tkeys.forEach(k=>{const mid=k.slice(0,k.indexOf("::"));s+=`### ${modName(mid)}｜${k.slice(k.indexOf("::")+2)}\n\n${S.topics[k].content}\n\n`;});}
  const notes=S.notes.filter(n=>inRange(n.createdAt,e.range));
  if(notes.length){s+=`## 错题整理卡\n\n`;notes.forEach(n=>{s+=`### ${n.title}\n\n${n.content}\n\n`;});}
  const list=filterList({mod:e.mod,range:e.range,state:e.scope,q:""});
  const groups={};list.forEach(x=>{const k=modName(x.module)+"｜"+(x.topic||"其他");(groups[k]=groups[k]||[]).push(x);});
  const keys=Object.keys(groups).sort();
  if(keys.length){s+=`## 按知识点的方法与易错点\n\n`;keys.forEach(k=>{s+=`### ${k}\n\n`;const seen=new Set();groups[k].forEach(x=>{[["规律",x.knowledge],["方法",x.method],["易错",x.trap]].forEach(([l,v])=>{if(v&&!seen.has(v)){seen.add(v);s+=`- ${l}：${v}\n`;}});});s+="\n";});}
  if(!tkeys.length&&!notes.length&&!keys.length){toast("这个范围里还没有内容");return;}
  saveFile(`知识库_${dayKey(d)}.md`,s,"text/markdown");
}
async function backup(){
  const images={};
  for(const c of S.chats){for(const m of c.messages){if(m.imageId&&!images[m.imageId]){try{const b=await DB.getImg(m.imageId);if(b)images[m.imageId]=await blobToDataURL(b);}catch(_){}}}}
  for(const x of S.mistakes){for(const id of (x.imageIds||[])){if(!images[id]){try{const b=await DB.getImg(id);if(b)images[id]=await blobToDataURL(b);}catch(_){}}}}
  const data={app:"beikao",version:2,exportedAt:Date.now(),progress:S.progress,items:S.mistakes.concat(S.notes,Object.values(S.topics),S.chats,S.decks,Object.values(S.deckProg)),images};
  saveFile(`${exam()}备考工作台备份_${dayKey(Date.now())}.json`,JSON.stringify(data),"application/json");
}
async function restore(file){
  try{
    const data=JSON.parse(await file.text());
    if(data.app!=="beikao"){toast("这不是备考工作台的备份文件");return;}
    if(!confirm("恢复会用备份里的内容替换现在的全部数据，确定吗？"))return;
    await DB.clear();
    for(const it of data.items||[])await DB.put(it);
    for(const [id,url] of Object.entries(data.images||{})){const b=await (await fetch(url)).blob();await DB.putImg(id,b);}
    const p=Object.assign({},data.progress||{});p.id="progress";p.kind="progress";await DB.put(p);
    await load();toast("恢复完成");
  }catch(e){console.error(e);toast("恢复失败：备份文件可能损坏");}
}

/* ========== 启动 ========== */
async function load(fromSync){
  const all=await DB.all();
  S.mistakes=all.filter(x=>x.kind==="mistake").sort((a,b)=>b.createdAt-a.createdAt);
  S.notes=all.filter(x=>x.kind==="note").sort((a,b)=>b.createdAt-a.createdAt);
  S.chats=all.filter(x=>x.kind==="chat").sort((a,b)=>b.createdAt-a.createdAt);
  S.decks=all.filter(x=>x.kind==="deck").sort((a,b)=>a.createdAt-b.createdAt);
  S.deckProg={};all.filter(x=>x.kind==="deckprog").forEach(x=>{S.deckProg[x.deck]=x;});
  S.topics={};all.filter(x=>x.kind==="topic").forEach(x=>{S.topics[x.key]=x;});
  const p=all.find(x=>x.id==="progress")||{};
  let modules=p.modules;
  if(!Array.isArray(modules)||!modules.length){
    modules=JSON.parse(JSON.stringify(DEFAULT_MODULES));
    const custom=p.custom||{};modules.forEach(m=>{(custom[m.id]||[]).forEach(t=>{if(!m.topics.includes(t))m.topics.push(t);});});
  }
  S.progress={status:p.status||{},modules,examName:p.examName||DEFAULT_EXAM,about:p.about!=null?p.about:DEFAULT_ABOUT,examDate:p.examDate||"",daily:p.daily||{}};
  if(!p.modules)saveProgress(!p.id);
  S.ready=true;
  if(fromSync&&document.activeElement&&["askIn","capNote","fQ"].includes(document.activeElement.id)){renderHeader();return;}
  render();
}
setTabs();render();
async function takeShared(){
  if(!new URLSearchParams(location.search).has("shared")||!("caches" in window))return;
  try{
    const c=await caches.open("beikao-share-inbox");const keys=await c.keys();const files=[];
    for(const k of keys){const r=await c.match(k);const b=await r.blob();files.push(new File([b],"分享_"+files.length+".jpg",{type:b.type||"image/jpeg"}));await c.delete(k);}
    history.replaceState(null,"",location.pathname+"#capture");setTabs();render();
    if(files.length)addFiles(files);
  }catch(e){console.error(e);}
}
if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(e=>console.warn(e));}
DB.open().then(()=>load()).then(()=>{takeShared();if(current()==="capture"&&lastId())setTimeout(goLast,200);Sync.setStatus(Sync.status);if(Sync.on())Sync.run();}).catch(e=>{console.error(e);S.err="浏览器不允许本地存储（可能开了无痕模式），数据没法保存。请用普通窗口打开。";S.ready=true;render();});
})();
